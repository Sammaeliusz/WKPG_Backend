services:
  postgres:
    image: 'postgres:latest'
    container_name: wkgp-backend-postgres-1
    environment:
      - 'POSTGRES_PASSWORD=SS3bSKpOprLzPz'
      - 'POSTGRES_DB=WKGP'
      - 'POSTGRES_USER=admin'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d WKGP']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    image: wkgp-backend:latest
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/WKGP'
      - 'SPRING_DATASOURCE_USERNAME=admin'
      - 'SPRING_DATASOURCE_PASSWORD=SS3bSKpOprLzPz'
    ports:
      - '8081:8080'
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
