services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_DB=WKGP'
      - 'POSTGRES_USER=admin'
    ports:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d WKGP']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    image: wkgp-backend:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/WKGP'
      - 'SPRING_DATASOURCE_USERNAME=admin'
      - 'SPRING_DATASOURCE_PASSWORD=secret'
    ports:
      - '8081:8080'
